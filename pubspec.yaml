name: thulirva_app
description: "THULIRVA Customer Ordering Mobile App for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: 11.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  google_maps_flutter: 2.10.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/products/
